<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MRSS - Your AI-Powered RSS Hub. Read Smarter with AI-intelligent RSS reader featuring summary, translation, and smart discovery."
    />
    <meta
      name="keywords"
      content="RSS reader, privacy-focused, cross-platform, desktop app, Wails, Vue.js, auto-translation, localization"
    />
    <title>MRSS - Read Smarter with AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="canonical" href="https://marcomarcogd.github.io/MRSS/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://marcomarcogd.github.io/MRSS/" />
    <meta property="og:title" content="MRSS - Modern Cross-Platform RSS Reader" />
    <meta
      property="og:description"
      content="A modern, cross-platform desktop RSS reader built with Wails and Vue.js. Features auto-translation, localization, and privacy-focused design."
    />
    <meta property="og:image" content="https://marcomarcogd.github.io/MRSS/assets/og.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://marcomarcogd.github.io/MRSS/" />
    <meta property="twitter:title" content="MRSS - Modern Cross-Platform RSS Reader" />
    <meta
      property="twitter:description"
      content="A modern, cross-platform desktop RSS reader built with Wails and Vue.js. Features auto-translation, localization, and privacy-focused design."
    />
    <meta
      property="twitter:image"
      content="https://marcomarcogd.github.io/MRSS/assets/twitter.png"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "MRSS",
        "description": "A modern, cross-platform desktop RSS reader built with Wails and Vue.js. Features auto-translation, localization, and privacy-focused design.",
        "url": "https://marcomarcogd.github.io/MRSS/",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Windows, macOS, Linux",
        "author": {
          "@type": "Person",
          "name": "marcomarcogd"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
