services:
  mrss-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "1234:1234"
    volumes:
      - mrss-data:/app/data
    environment:
      - MRSS_DEBUG=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1234/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mrss-network

networks:
  mrss-network:
    driver: bridge

volumes:
  mrss-data:
    driver: local
